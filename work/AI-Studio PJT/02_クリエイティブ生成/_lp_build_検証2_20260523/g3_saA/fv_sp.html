<!DOCTYPE html>
<!--
  fv_template.html — LP ファーストビュー(FV) 単一HTMLテンプレート
  ============================================================================
  compose_fv.py が string.Template で以下のプレースホルダを置換する。
  プレースホルダ名は compose_fv.py と厳密一致させること:

    kv_sp_1.jpg   : 背景KV画像 (HTMLからの相対URL=ファイル名。out_dirをHTTP配信して解決)
       : アイブロウ(小ラベル) ブロック (空なら "")
    諦めた矯正、<br>9万円から。      : メインコピー (HTML エスケープ済み, <br> 改行可)
    3ヶ月24枚で前歯から。検査も無料です。       : サブコピー (HTML エスケープ済み)
    無料検診をLINEで予約      : CTA ボタンラベル (HTML エスケープ済み)
    <div class="fv__logo">キレイライン矯正</div>      : ロゴ(テキスト) ブロック (空なら "")
    #ffffff     : 文字色 (例 #ffffff)
    #F4B5A8   : アクセント色 (例 #ff5a2b)
    rgba(0,0,0,0.35)  : スクリム基調色 (例 rgba(0,0,0,0.35))
    center          : 水平揃え (left | center)
    top       : 縦方向配置 (top | center | bottom)
    sp       : "sp" または "pc" (レイアウト微調整に使用)

  ネットワークアクセス禁止: フォントはsystem、画像は同一out_dir内の相対参照のみ
  (スキルがout_dirをローカルHTTP配信しPlaywrightで開く。外部CDN/フォント不使用)。
-->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>First View</title>
<style>
  :root {
    --text: #ffffff;
    --accent: #F4B5A8;
    --overlay: rgba(0,0,0,0.35);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #0a0a0a;
  }

  body {
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN",
                 "Noto Sans JP", "Yu Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    color: var(--text);
    overflow: hidden;
  }

  /* ===== ステージ (FV 全体) ===== */
  .fv {
    position: relative;
    width: 100%;
    min-height: 100vh;
    height: 100vh;
    overflow: hidden;
    isolation: isolate;
  }

  /* 背景 KV 画像 */
  .fv__bg {
    position: absolute;
    inset: 0;
    background-image: url("kv_sp_1.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    z-index: 0;
    transform: scale(1.02); /* エッジの白縁防止 */
  }

  /* スクリム: 視線誘導 + 可読性確保 (グラデ二層) */
  .fv__scrim {
    position: absolute;
    inset: 0;
    z-index: 1;
    background:
      linear-gradient(
        to bottom,
        rgba(0,0,0,0.05) 0%,
        rgba(0,0,0,0) 30%,
        var(--overlay) 70%,
        rgba(0,0,0,0.62) 100%
      ),
      radial-gradient(
        120% 90% at 25% 60%,
        var(--overlay) 0%,
        rgba(0,0,0,0) 60%
      );
  }

  /* コンテンツ安全エリア */
  .fv__content {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    padding: 7vw 8vw;
    gap: clamp(14px, 2.4vh, 28px);
  }
  .fv__content[data-pos="top"]    { justify-content: flex-start; padding-top: 12vh; }
  .fv__content[data-pos="center"] { justify-content: center; }
  .fv__content[data-pos="bottom"] { justify-content: flex-end; padding-bottom: 11vh; }
  .fv__content[data-align="left"]   { align-items: flex-start; text-align: left; }
  .fv__content[data-align="center"] { align-items: center; text-align: center; }

  .fv__inner {
    max-width: 760px;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: inherit;
  }
  .fv__content[data-align="center"] .fv__inner { align-items: center; }

  /* ロゴ */
  .fv__logo {
    font-size: clamp(15px, 2.1vh, 20px);
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0.92;
    text-shadow: 0 1px 6px rgba(0,0,0,0.5);
  }

  /* アイブロウ (小ラベル) */
  .fv__eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 0.5em;
    font-size: clamp(12px, 1.7vh, 15px);
    font-weight: 700;
    letter-spacing: 0.16em;
    padding: 0.5em 1em;
    border: 1px solid color-mix(in srgb, var(--accent) 70%, transparent);
    border-radius: 999px;
    background: color-mix(in srgb, var(--accent) 16%, transparent);
    color: var(--text);
    backdrop-filter: blur(2px);
    text-shadow: 0 1px 4px rgba(0,0,0,0.45);
  }
  .fv__eyebrow::before {
    content: "";
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
  }

  /* メインコピー: 特大・高可読 */
  .fv__main {
    font-size: clamp(30px, 7.4vw, 64px);
    line-height: 1.18;
    font-weight: 900;
    letter-spacing: 0.005em;
    text-shadow:
      0 2px 14px rgba(0,0,0,0.55),
      0 1px 3px rgba(0,0,0,0.7);
  }
  .fv__main .accent { color: var(--accent); }

  /* サブコピー */
  .fv__sub {
    font-size: clamp(15px, 2.5vh, 21px);
    line-height: 1.7;
    font-weight: 500;
    max-width: 42em;
    opacity: 0.96;
    text-shadow: 0 1px 8px rgba(0,0,0,0.6);
  }

  /* CTA */
  .fv__cta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.6em;
    margin-top: clamp(6px, 1vh, 14px);
    padding: clamp(15px, 2vh, 20px) clamp(30px, 5vw, 52px);
    font-size: clamp(16px, 2.2vh, 20px);
    font-weight: 800;
    letter-spacing: 0.03em;
    color: #ffffff;
    background: linear-gradient(
      135deg,
      var(--accent) 0%,
      color-mix(in srgb, var(--accent) 78%, #000) 100%
    );
    border: none;
    border-radius: 999px;
    box-shadow:
      0 10px 30px color-mix(in srgb, var(--accent) 45%, transparent),
      0 2px 6px rgba(0,0,0,0.35);
    text-decoration: none;
    cursor: pointer;
  }
  .fv__cta::after {
    content: "→";
    font-size: 1.1em;
    line-height: 1;
    transform: translateY(0.02em);
  }

  /* ===== レスポンシブ ===== */
  /* SP (縦長) を基準。PC (横長) では密度・最大幅を拡張 */
  @media (min-aspect-ratio: 1/1) {
    .fv__content { padding: 6vh 7vw; }
    .fv__inner   { max-width: 720px; }
    .fv__main    { font-size: clamp(36px, 4.6vw, 76px); }
    .fv__sub     { font-size: clamp(16px, 1.5vw, 23px); }
  }
  @media (max-width: 480px) {
    .fv__content { padding: 8vw 7vw; }
    .fv__main    { font-size: clamp(28px, 8.4vw, 46px); }
  }

  @media print {
    body { overflow: visible; }
    .fv  { height: 100vh; }
  }
</style>
</head>
<body>
  <main class="fv" data-viewport="sp">
    <div class="fv__bg" role="img" aria-label="key visual background"></div>
    <div class="fv__scrim"></div>
    <div class="fv__content" data-pos="top" data-align="center">
      <div class="fv__inner">
        <div class="fv__logo">キレイライン矯正</div>
        
        <h1 class="fv__main">諦めた矯正、<br>9万円から。</h1>
        <p class="fv__sub">3ヶ月24枚で前歯から。検査も無料です。</p>
        <a class="fv__cta" href="#cta" role="button">無料検診をLINEで予約</a>
      </div>
    </div>
  </main>
</body>
</html>
